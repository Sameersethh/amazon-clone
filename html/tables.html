<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }
        td, th{
            border: 1px solid black;
        }
    </style>
</head>
<body> 
    <table>
        <tr>
            <th>Country</th>
            <th>Country CODE</th>
            <th>Email</th>
        </tr>
        <tr>
            <td>india</td>
            <td>IN</td>
            <td>india@gmail.com</td>    
        </tr>
        <tr>
            <td>japan</td>
            <td>j</td>
            <td>japan@gmail.com</td>    
        </tr>
        <tr>
            <td>united states of america</td>
            <td>usa</td>
            <td>usa@gmail.com</td>    
        </tr>
        
    </table>
</body>
</html>
